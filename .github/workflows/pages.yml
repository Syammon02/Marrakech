name: Déploiement GitHub Pages

on:
  push:
    branches: ["claude/marrakech-interactive-web-app-daeo2e", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement crée le site Pages via l'API si le dépôt ne l'a pas encore
      # activé, au lieu d'échouer sur « Get Pages site failed »
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
