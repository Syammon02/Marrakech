name: Déploiement GitHub Pages

on:
  push:
    branches: ["claude/marrakech-interactive-web-app-daeo2e", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages doit être activé une fois à la main dans Settings, source
      # « GitHub Actions » : le GITHUB_TOKEN n'a pas le droit de créer le site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
